name: Production data fix

# 운영 DB 데이터 직접 수정 — 정말 필요할 때만(2026-10-25 배포 규칙 4, docs/engineering/deploy-runbook.md 9번).
# 원칙은 "운영자 화면 기능으로 처리". 화면에 없는 일회성 수정이 꼭 필요하면:
#   1) SQL을 ops/data-fixes/YYYYMMDD-설명.sql로 커밋해 main에 올림(무엇을 왜 바꾸는지 맨 위 주석, 리뷰 가능한 기록)
#   2) 이 워크플로 실행 → [승인 1] dry-run: 백업 → 한 트랜잭션으로 실행해 바뀌는 줄 수를 보여 주고 ROLLBACK(아무것도 안 바뀜)
#      입력한 expected_rows와 다르면 여기서 멈춤
#   3) [승인 2] apply: 같은 커밋의 같은 파일을 한 트랜잭션으로 실제 실행, 줄 수가 또 같아야 COMMIT
# 승인 1 = GitHub Environment "production", 승인 2 = "production-data"(둘 다 승인자 = 사용자).
on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: ops/data-fixes/ 아래 SQL 파일(main에 커밋된 것)
        required: true
      expected_rows:
        description: 바뀔 것으로 예상하는 줄 수 합계(dry-run 결과와 같아야 진행)
        required: true
      reason:
        description: 왜 화면 기능으로 못 하는지(기록용)
        required: true

permissions:
  contents: read

concurrency:
  group: production-data-fix
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SQL_FILE: ${{ inputs.sql_file }}
      EXPECTED: ${{ inputs.expected_rows }}
      # 자유 글은 스크립트에 바로 넣지 않고 환경 변수로(따옴표·$( 가 들어가면 깨지거나 명령으로 실행됨, 2026-10-28)
      REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: 파일 확인
        run: |
          [[ "$SQL_FILE" =~ ^ops/data-fixes/[0-9]{8}-[a-z0-9-]+\.sql$ ]] || { echo "⛔ ops/data-fixes/YYYYMMDD-설명.sql 형식만"; exit 1; }
          [ -f "$SQL_FILE" ] || { echo "⛔ main에 없는 파일"; exit 1; }
          [[ "$EXPECTED" =~ ^[0-9]+$ ]] || { echo "⛔ expected_rows는 숫자"; exit 1; }
          if grep -Eiq '\b(BEGIN|COMMIT|ROLLBACK|DROP|TRUNCATE|ALTER|CREATE|GRANT|REVOKE)\b' "$SQL_FILE"; then
            echo "⛔ 트랜잭션 제어·구조 변경 문장은 넣지 않음(구조는 마이그레이션으로)"; exit 1
          fi
          { echo "### 운영 데이터 수정 — \`$SQL_FILE\`"; echo "- 이유: $REASON"; echo '```sql'; cat "$SQL_FILE"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 백업
        uses: ./.github/actions/db-backup
        with:
          database-url: ${{ secrets.PROD_DATABASE_URL }}
          gpg-public-key: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
          s3-endpoint: ${{ secrets.BACKUP_S3_ENDPOINT }}
          s3-bucket: ${{ secrets.BACKUP_S3_BUCKET }}
          s3-access-key-id: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          label: data-fix
      - name: 미리보기(실행 후 ROLLBACK)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -o pipefail
          { echo 'BEGIN;'; cat "$SQL_FILE"; echo; echo 'ROLLBACK;'; } \
            | /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -P pager=off 2>&1 | tee dry-run.txt
          ROWS=$(grep -Eo '^(UPDATE|DELETE|INSERT 0) [0-9]+' dry-run.txt | awk '{s+=$NF} END {print s+0}')
          echo "- 미리보기: 바뀌는 줄 **$ROWS**개(예상 $EXPECTED) — 실제로는 아무것도 안 바뀜(ROLLBACK)" >> "$GITHUB_STEP_SUMMARY"
          [ "$ROWS" = "$EXPECTED" ] || { echo "⛔ 예상과 다름 — SQL을 다시 확인" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }

  apply:
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-data
    env:
      SQL_FILE: ${{ inputs.sql_file }}
      EXPECTED: ${{ inputs.expected_rows }}
    steps:
      - uses: actions/checkout@v4
      - name: psql 설치
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 > /dev/null
      # 줄 수가 미리보기와 다르면(그사이 데이터가 바뀜) 트랜잭션 안에서 오류를 내 되돌림
      - name: 실행(줄 수가 같을 때만 COMMIT)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -o pipefail
          { echo 'BEGIN;'; cat "$SQL_FILE"; echo; echo 'ROLLBACK;'; } \
            | /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -P pager=off 2>&1 | tee recheck.txt
          ROWS=$(grep -Eo '^(UPDATE|DELETE|INSERT 0) [0-9]+' recheck.txt | awk '{s+=$NF} END {print s+0}')
          [ "$ROWS" = "$EXPECTED" ] || { echo "⛔ 승인 사이에 데이터가 바뀜($ROWS ≠ $EXPECTED) — 다시 미리보기부터" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          { echo 'BEGIN;'; cat "$SQL_FILE"; echo; echo 'COMMIT;'; } \
            | /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -P pager=off 2>&1 | tee apply.txt
          echo "- ✅ 실행 완료: $ROWS줄" >> "$GITHUB_STEP_SUMMARY"
