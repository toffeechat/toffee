<style>
  /* 브랜드 색·글꼴은 docs/product/brand-guide.md 기준 */
  :root {
    --charcoal: #0F1115;
    --ink: #3A3F4B;
    --muted: #5A6070;
    --paper: #FBFBFD;
    --mist: #F4F6FB;
    --periwinkle: #DCE1FF;
    --lavender: #7C8CFF;
    --lavender-deep: #4F5BD5;
    --line: #E3E6F0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: Pretendard, 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--charcoal);
    background: var(--paper);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  html[lang="th"] body { font-family: 'Noto Sans Thai', Pretendard, -apple-system, sans-serif; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  header { position: sticky; top: 0; z-index: 10; background: rgba(251, 251, 253, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid transparent; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  header .logo img { height: 30px; width: auto; }
  .langs { display: flex; gap: 4px; background: var(--mist); padding: 4px; border-radius: 999px; }
  .langs button { border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: #fff; color: var(--charcoal); box-shadow: 0 1px 3px rgba(15, 17, 21, 0.12); }

  .hero { background: linear-gradient(180deg, var(--paper) 0%, var(--paper) 35%, var(--periwinkle) 100%); padding: 72px 0 0; overflow: hidden; }
  .hero .wrap { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: end; }
  .hero-copy { padding-bottom: 96px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--lavender-deep); background: #fff; border: 1px solid var(--periwinkle); padding: 6px 14px; border-radius: 999px; }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--lavender); }
  h1 { font-family: Pretendard, sans-serif; font-size: clamp(40px, 6vw, 68px); line-height: 1.08; letter-spacing: -0.02em; margin: 24px 0 20px; }
  .lead { font-size: clamp(18px, 2.2vw, 21px); color: var(--ink); max-width: 30em; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: 16px; padding: 14px 24px; border-radius: 14px; }
  .btn-dark { background: var(--charcoal); color: #fff; }
  .btn-light { background: #fff; color: var(--charcoal); border: 1px solid var(--line); }
  .phones { display: flex; justify-content: center; gap: 16px; align-items: flex-end; }
  .phone { width: 220px; border-radius: 34px; border: 6px solid var(--charcoal); overflow: hidden; background: #fff; box-shadow: 0 24px 60px rgba(15, 17, 21, 0.18); }
  .phone img { width: 100%; height: auto; }
  .phone.small { width: 180px; margin-bottom: 40px; }

  section { padding: 96px 0; }
  .eyebrow { font-size: 14px; font-weight: 700; color: var(--lavender-deep); letter-spacing: 0.02em; }
  h2 { font-family: Pretendard, sans-serif; font-size: clamp(28px, 4vw, 40px); line-height: 1.25; letter-spacing: -0.01em; margin: 12px 0 0; max-width: 22em; }
  html[lang="th"] h2 { font-family: 'Noto Sans Thai', Pretendard, sans-serif; letter-spacing: 0; line-height: 1.3; }
  /* 슬로건은 모든 언어에서 영어 그대로(브랜드 원칙) — 태국어 화면에서도 Pretendard */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
  .card { background: var(--mist); border-radius: 20px; padding: 28px; }
  .card .num { font-family: Pretendard, sans-serif; font-weight: 700; font-size: 28px; color: var(--lavender); }
  .card h3 { font-size: 20px; margin: 8px 0 8px; }
  .card p { color: var(--ink); }

  .agency { background: var(--charcoal); color: #F4F6FB; }
  .agency .eyebrow { color: #9AA6FF; }
  .agency .points { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
  .agency .point { border: 1px solid #2E3448; background: #1C2030; border-radius: 20px; padding: 28px; }
  .agency .point h3 { font-size: 20px; margin-bottom: 8px; }
  .agency .point p { color: #C9CEDC; }

  .contact .box { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; background: var(--mist); border-radius: 24px; padding: 40px; margin-top: 40px; }
  .contact dl { display: grid; grid-template-columns: auto 1fr; gap: 12px 24px; font-size: 18px; }
  .contact dt { color: var(--muted); }
  .contact dd { font-weight: 600; }
  .qr { text-align: center; font-size: 14px; color: var(--muted); }
  .qr img { width: 150px; height: 150px; background: #fff; border-radius: 16px; padding: 10px; margin: 0 auto 8px; }

  footer { border-top: 1px solid var(--line); padding: 32px 0 48px; color: var(--muted); font-size: 14px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center; }
  footer nav { display: flex; gap: 20px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 12px; }

  @media (max-width: 860px) {
    .hero { padding-top: 40px; }
    .hero .wrap { grid-template-columns: 1fr; gap: 40px; }
    .hero-copy { padding-bottom: 0; }
    .phone { width: 170px; border-radius: 26px; border-width: 5px; }
    .phone.small { width: 140px; margin-bottom: 28px; }
    .phone.hide-sm { display: none; }
    .cards, .agency .points { grid-template-columns: 1fr; }
    section { padding: 64px 0; }
    .contact .box { grid-template-columns: 1fr; padding: 28px; }
    .contact dl { grid-template-columns: 1fr; gap: 2px; font-size: 16px; }
    .contact dd { margin-bottom: 12px; overflow-wrap: anywhere; }
  }
</style>

      a2t: 'ควบคุมได้ทั้งหมด',
      a2p: 'ต้นสังกัดดูข้อความทุกข้อความได้ และเรียกคืนข้อความที่มีปัญหาได้ทันที',

      terms: 'ข้อกำหนดการใช้งาน'
    },
    en: {
      badge: 'Launching in 2027',
      lead: 'A subscription chat app connecting Thai artists with fans around the world. Fans receive messages, photos, voice notes and videos from their artist in a private chat room.',

      a2t: 'You stay in control',

    },
    ko: {
      badge: '2027년 출시 예정',
      lead: '태국 아티스트와 전 세계 팬을 잇는 구독형 채팅 앱입니다. 팬은 아티스트가 보낸 메시지·사진·음성·영상을 1:1 채팅방에서 받습니다.',

      a3p: '앱·결제·번역·팬 응대는 토피 팀이 모두 맡습니다.',
      ctEyebrow: '문의',
      ctTitle: '관심 있는 소속사·아티스트라면 편하게 연락 주세요',

      qr: 'LINE으로 친구 추가',
      privacy: '개인정보처리방침',
      terms: '이용약관'
    }

  function pick() {
    var q = new URLSearchParams(location.search).get('lang');
    if (q && T[q]) return q;
    try { var saved = localStorage.getItem('toffee_lang'); if (saved && T[saved]) return saved; } catch (e) {}
    var langs = navigator.languages || [navigator.language || 'th'];
    for (var i = 0; i < langs.length; i++) {
      var l = String(langs[i]).slice(0, 2).toLowerCase();
      if (T[l]) return l;
    }
    return 'en';
  }

  function apply(lang) {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t[el.getAttribute('data-i18n')]; });
    document.querySelectorAll('[data-legal]').forEach(function (el) {
      el.href = 'https://api-demo.toffeechat.app/legal/' + el.getAttribute('data-legal') + '?lang=' + lang;
    });
    document.querySelectorAll('.langs button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
  }

  document.querySelectorAll('.langs button').forEach(function (b) {
    b.addEventListener('click', function () {
      var lang = b.getAttribute('data-lang');
      try { localStorage.setItem('toffee_lang', lang); } catch (e) {}
      apply(lang);
    });
  });
  apply(pick());
</script>
